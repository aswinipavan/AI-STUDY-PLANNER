server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.datasource.hikari.initialization-fail-timeout=30000
spring.flyway.baseline-on-migrate=true

# Database connection pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Transaction management
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Async task execution
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ai-study-async-

# Task scheduling
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=ai-study-scheduler-

supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.anon-key=${SUPABASE_ANON_KEY:}

# File uploads (materials up to 50MB). Without these, Spring Boot caps files at 1MB and rejects uploads.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
# Where uploaded files are stored when Supabase Storage is not configured (e.g. local profile).
storage.local.dir=${STORAGE_LOCAL_DIR:uploads}

firebase.project-id=${FIREBASE_PROJECT_ID}

# ── AI providers ───────────────────────────────────────────────────────────────
# Two providers, tried in a fixed order: AgentRouter (Claude) first, Groq second.
# Both keys are BACKEND-ONLY. They must never appear in frontend/.env.local,
# frontend/.env.production, any NEXT_PUBLIC_* variable, or mobile/ source.
#
# A provider whose api-key is blank is skipped rather than attempted, so both of
# these are safe to leave unset: set only AGENTROUTER_API_KEY to run Claude-only,
# only GROQ_API_KEY to keep the pre-existing Groq-only behaviour, or both to get
# the primary plus automatic fallback. Neither key has a default value here —
# only an empty fallback so a missing one cannot break context startup.

# PRIMARY — AgentRouter, which speaks the Anthropic Messages API (POST <base>/v1/messages).
agentrouter.api-key=${AGENTROUTER_API_KEY:}
agentrouter.base-url=${AGENTROUTER_BASE_URL:https://agentrouter.org}
agentrouter.model=${AGENTROUTER_MODEL:claude-opus-5}
agentrouter.enabled=${AGENTROUTER_ENABLED:true}
# Shorter read timeout than Groq on purpose: the primary must give up quickly so the
# fallback still fits inside the client's own timeout budget. 22s is measured — the primary
# answers real requests at up to ~17s, but prompts needing long structured output never
# return usable text at all (25s+). 22s + Groq's worst case stays under the mobile app's
# 60s AI timeout. See AgentRouterConfig for the full reasoning.
agentrouter.connect-timeout-seconds=${AGENTROUTER_CONNECT_TIMEOUT_SECONDS:5}
agentrouter.read-timeout-seconds=${AGENTROUTER_READ_TIMEOUT_SECONDS:22}
agentrouter.anthropic-version=${AGENTROUTER_ANTHROPIC_VERSION:2023-06-01}
# The router refuses a generic HTTP client signature even with a valid key.
agentrouter.user-agent=${AGENTROUTER_USER_AGENT:claude-cli/2.0.0 (external, cli)}
agentrouter.disable-thinking=${AGENTROUTER_DISABLE_THINKING:true}
# Extra tokens on top of the caller's ceiling, to cover the thinking block the router
# emits regardless of the flag above. Without headroom a reply can be truncated
# before a single text block is produced.
agentrouter.thinking-headroom-tokens=${AGENTROUTER_THINKING_HEADROOM_TOKENS:1024}

# FALLBACK — Groq (OpenAI-compatible). Unchanged model default.
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.enabled=${GROQ_ENABLED:true}

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS — set ALLOWED_ORIGINS env var on your deployment host (comma-separated)
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Logging
logging.level.root=INFO
logging.level.com.aistudyplanner=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data=DEBUG
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/app.log
logging.file.max-size=10MB
logging.file.max-history=10

# Actuator
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoint.health.show-details=when-authorized
management.endpoint.env.enabled=false
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
