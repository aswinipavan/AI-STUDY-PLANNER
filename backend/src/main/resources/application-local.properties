# ============================================================
# application-local.properties
# Local development profile — uses a FILE-BASED H2 database that
# PERSISTS across backend restarts (data survives a restart + re-login).
# Run with: -Dspring.profiles.active=local
# ============================================================

# --- H2 File-Based Database (PostgreSQL compatibility mode) ---
# Stored at ./data/studyplanner.mv.db relative to the backend working directory (override with H2_DB_PATH).
# file: (not mem:) is what makes local data durable. AUTO_SERVER=TRUE enables seamless multi-connection / restart handling.
spring.datasource.url=jdbc:h2:file:${H2_DB_PATH:./data/studyplanner};AUTO_SERVER=TRUE;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 Web Console (access at http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update = Hibernate creates/alters tables to match entities; handles columns added after schema-local.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Schema initialization (H2-compatible schema) ---
# Runs on every start, but schema-local.sql is fully idempotent (CREATE TABLE/INDEX IF NOT EXISTS and
# an insert-once demo seed guarded by WHERE NOT EXISTS), so it is safe against the now-persistent DB
# and never resets existing data.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-local.sql
spring.sql.init.continue-on-error=false

# --- Disable Flyway (Flyway migrations use PostgreSQL-specific SQL) ---
spring.flyway.enabled=false

# --- HikariCP (lighter config for local) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=5000

# --- File storage: local filesystem, never production Supabase Storage ---
# storage.backend=local forces StorageService onto its local-filesystem branch, so uploads land under
# ./uploads/<bucket>/... and are served back by FileController at /api/files/<bucket>/<path>.
# Why a separate key instead of just blanking supabase.url below: SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY exist as OS environment variables (backend/.env). Spring's relaxed binding
# maps those onto supabase.url / supabase.service-role-key, and environment variables outrank
# profile property files — so the blank values below are NOT what StorageService sees, and local
# uploads would otherwise be written into the real production bucket. .env defines no STORAGE_BACKEND.
storage.backend=local

# Kept blank so nothing else in the local profile depends on real Supabase credentials.
# (Effective only when the env vars above are absent — see the note on precedence.)
supabase.url=
supabase.service-role-key=
supabase.anon-key=

# --- CORS ---
allowed.origins=http://localhost:3000

# --- Logging ---
logging.level.root=INFO
logging.level.com.aistudyplanner=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.jdbc=DEBUG
