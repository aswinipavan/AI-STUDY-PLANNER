# application-test.properties
# Safe, isolated configuration for automated tests

# Use Testcontainers JDBC URL scheme
spring.datasource.url=jdbc:tc:postgresql:15-alpine:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable remote services for integration tests unless mocked
groq.api.key=dummy-groq-key
jwt.secret=dummy-jwt-secret-that-is-long-enough-for-hs256-12345
razorpay.key.id=rzp_test_dummy
razorpay.key.secret=dummy_secret

# Logging
logging.level.org.springframework.test=INFO
logging.level.com.aistudyplanner=DEBUG
