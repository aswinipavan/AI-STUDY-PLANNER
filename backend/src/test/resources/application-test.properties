# application-test.properties
# Safe, isolated configuration for automated tests

# Use H2 in-memory database for tests (Docker daemon not available)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

# Disable remote services for integration tests unless mocked
groq.api.key=dummy-groq-key
jwt.secret=dummy-jwt-secret-that-is-long-enough-for-hs256-12345
razorpay.key.id=rzp_test_dummy
razorpay.key.secret=dummy_secret

# Logging
logging.level.org.springframework.test=INFO
logging.level.com.aistudyplanner=DEBUG
