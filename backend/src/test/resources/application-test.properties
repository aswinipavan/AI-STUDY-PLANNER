# application-test.properties
# Safe, isolated configuration for automated tests

# Use H2 in-memory database for tests (Docker daemon not available)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

# Disable remote services for integration tests unless mocked
# AI providers: dummy credentials AND both switched off, so no test can ever reach
# agentrouter.org or api.groq.com — even if backend/.env supplies a real key to the
# test JVM. Provider transport and fallback behaviour are covered by unit tests with
# mocked HTTP clients (AgentRouterProviderTest, GroqProviderTest, AiProviderGatewayTest).
agentrouter.api-key=dummy-agentrouter-key
agentrouter.enabled=false
groq.api-key=dummy-groq-key
groq.enabled=false
jwt.secret=dummy-jwt-secret-that-is-long-enough-for-hs256-12345

# Razorpay: RazorpayConfig reads razorpay.key-id / razorpay.key-secret (hyphenated), which
# application.properties maps to ${RAZORPAY_KEY_ID} / ${RAZORPAY_KEY_SECRET} with no default.
# Those env vars come from the gitignored backend/.env via spring-dotenv, so they do not exist
# in CI. Overriding them here keeps the full-context tests bootable without real credentials.
# (These were previously spelled razorpay.key.id / razorpay.key.secret, which matched nothing.)
razorpay.key-id=rzp_test_dummy
razorpay.key-secret=dummy_secret

# Firebase: same story — application.properties has firebase.project-id=${FIREBASE_PROJECT_ID}
# with no default. The real SDK is not initialised in tests at all; FirebaseConfig is
# @Profile("!test") and TestFirebaseConfig supplies stub beans, so this value is never used to
# reach Google. It only has to be present and non-blank.
firebase.project-id=test-firebase-project

# Logging
logging.level.org.springframework.test=INFO
logging.level.com.aistudyplanner=DEBUG
