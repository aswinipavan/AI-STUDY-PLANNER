name: Selenium Web E2E Test Suite

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]
  workflow_dispatch:

jobs:
  selenium-e2e:
    name: Run 320-Case Selenium Web E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Start Next.js Server
        working-directory: ./frontend
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Execute 320 Selenium E2E Tests
        run: python testing/selenium_e2e_suite.py

      - name: Consolidate Selenium Excel Workbook
        run: python testing/consolidate_test_reports.py

      - name: Upload Selenium E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-reports
          path: |
            testing/reports/AI_Study_Planner_Selenium_E2E.xlsx
            testing/reports/selenium_e2e_results.csv
            testing/reports/selenium_e2e_report.html
            testing/reports/junit_results.xml
          retention-days: 30
