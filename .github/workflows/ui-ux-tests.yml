name: UI/UX & Design System Test Suite

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]
  workflow_dispatch:

jobs:
  ui-ux-tests:
    name: Run 300-Case UI/UX & Accessibility Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Report Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Verify UI/UX Test Suite and Consolidate Reports
        run: python testing/consolidate_test_reports.py

      - name: Upload UI/UX Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-test-reports
          path: |
            testing/reports/AI_Study_Planner_UI_UX_Test.xlsx
            AI_Study_Planner_Complete_Test_Suite.xlsx
          retention-days: 30
