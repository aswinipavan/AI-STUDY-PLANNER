name: Master Test Automation & Quality Assurance Pipeline

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]
  workflow_dispatch:

jobs:
  ui-ux-suite:
    name: 1. UI/UX & Design System (300 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify UI/UX Test Suite
        run: python testing/consolidate_test_reports.py

      - name: Upload UI/UX Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-ui-ux-reports
          path: testing/reports/AI_Study_Planner_UI_UX_Test.xlsx
          retention-days: 30

  selenium-e2e-suite:
    name: 2. Selenium Web E2E (320 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Start Next.js Server
        working-directory: ./frontend
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Execute 320 Selenium E2E Tests
        run: python testing/selenium_e2e_suite.py

      - name: Upload Selenium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-selenium-reports
          path: |
            testing/reports/AI_Study_Planner_Selenium_E2E.xlsx
            testing/reports/selenium_e2e_results.csv
            testing/reports/selenium_e2e_report.html
            testing/reports/junit_results.xml
          retention-days: 30

  load-testing-suite:
    name: 3. High-Concurrency Load Testing (312 Scenarios)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Load Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 312 Load Scenarios
        run: python testing/load/load_test_runner.py

      - name: Upload Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-load-test-reports
          path: |
            testing/reports/AI_Study_Planner_Load_Test.xlsx
            testing/reports/load_test_results.csv
            testing/reports/load_test_summary.json
            testing/reports/load_test_report.html
          retention-days: 30

  appium-mobile-suite:
    name: 4. Appium Mobile E2E (260 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Appium 3.x & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Appium Python Client Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 260 Appium Mobile E2E Tests (4-State Pattern)
        run: python testing/appium/appium_e2e_runner.py

      - name: Upload Appium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-appium-reports
          path: |
            testing/reports/AI_Study_Planner_Appium_E2E.xlsx
            testing/reports/appium_e2e_results.csv
            testing/reports/appium_e2e_report.html
            testing/reports/appium_junit_results.xml
            testing/reports/appium_e2e_summary.json
          retention-days: 30

  master-consolidation:
    name: 5. Master Report Consolidation & Quality Sign-Off
    needs: [ui-ux-suite, selenium-e2e-suite, load-testing-suite, appium-mobile-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Report Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Master Consolidated Excel Workbook (1,192 Tests)
        run: |
          python testing/consolidate_test_reports.py
          python testing/verify_reports.py

      - name: Upload Consolidated Master Test Artifacts (All 5 Excel Files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Study-Planner-Master-Quality-Suite
          path: |
            testing/reports/AI_Study_Planner_MASTER_Test_Report.xlsx
            testing/reports/AI_Study_Planner_Selenium_E2E.xlsx
            testing/reports/AI_Study_Planner_UI_UX_Test.xlsx
            testing/reports/AI_Study_Planner_Load_Test.xlsx
            testing/reports/AI_Study_Planner_Appium_E2E.xlsx
            testing/reports/selenium_e2e_results.csv
            testing/reports/selenium_e2e_report.html
            testing/reports/load_test_results.csv
            testing/reports/load_test_report.html
            testing/reports/appium_e2e_results.csv
            testing/reports/appium_e2e_report.html
            testing/reports/junit_results.xml
            testing/reports/appium_junit_results.xml
          retention-days: 90
