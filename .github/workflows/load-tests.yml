name: Baseline Load Testing Suite

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]
  workflow_dispatch:

jobs:
  load-tests:
    name: Run 312-Scenario Baseline Load Testing (100 VUs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Load Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl urllib3

      - name: Execute 312 Load Scenarios
        run: python testing/load/load_test_runner.py

      - name: Upload Load Testing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-testing-reports
          path: |
            testing/reports/AI_Study_Planner_Load_Test.xlsx
            testing/reports/load_test_results.csv
            testing/reports/load_test_summary.json
            testing/reports/load_test_report.html
          retention-days: 30
