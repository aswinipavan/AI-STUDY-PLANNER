apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

project.ext.set("hermesEnabled", true)

react {
    /* Autolinking & codegen settings */
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.study.planner"
    defaultConfig {
        applicationId "com.study.planner"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    
    // Autolinked Native Modules
    implementation project(":react-native-community_netinfo")
    implementation project(":react-native-firebase_app")
    implementation project(":react-native-firebase_auth")
    implementation project(":react-native-encrypted-storage")
    implementation project(":react-native-gesture-handler")
    implementation project(":react-native-linear-gradient")
    implementation project(":react-native-reanimated")
    implementation project(":react-native-safe-area-context")
    implementation project(":react-native-screens")
    implementation project(":react-native-vector-icons")

    // Firebase BOM — manages all firebase versions together
    implementation(platform("com.google.firebase:firebase-bom:33.3.0"))
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-analytics")
}


